<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend for LAB-02</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #0056b3;
        }
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        form {
            margin-bottom: 15px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>CPAN 212 – Modern Web Development – Lab 2</h1>

    <!-- Name Form -->
    <div class="form-container">
        <h2>Name</h2>
        <form action="/name" method="get">
            <button type="submit">Get Name</button>
        </form>
    </div>

    <!-- Greeting Form -->
    <div class="form-container">
        <h2>Greeting</h2>
        <form action="/greeting" method="get">
            <button type="submit">Get Greeting</button>
        </form>
    </div>

    <!-- Add Form -->
    <div class="form-container">
        <h2>Add</h2>
        <form action="/add" method="get">
            <input type="number" name="x" placeholder="Enter X" required>
            <input type="number" name="y" placeholder="Enter Y" required>
            <button type="submit">Calculate</button>
        </form>
    </div>

    <!-- Calculate Form -->
    <div class="form-container">
        <h2>Calculator</h2>
        <form action="/calculate" method="get">
            <input type="number" name="a" placeholder="Enter A" required>
            <input type="number" name="b" placeholder="Enter B" required>
            <input type="text" name="operation" placeholder="Enter Operation (+, -, *, /, **)" required>
            <button type="submit">Calculate</button>
        </form>
    </div>
</body>
</html>
